<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rust Server Solutions – Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #3d2819 0, #050608 55%);
      color: #f5f5f5;
      font-family: 'Permanent Marker', cursive;
    }
    .card {
      background: rgba(10, 10, 12, 0.9);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: linear-gradient(90deg, rgba(255, 111, 0, 0.15), rgba(255, 255, 255, 0.02));
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: #ffb27a;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff6f00;
      box-shadow: 0 0 10px rgba(255, 111, 0, 0.8);
    }
    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    h1 span {
      color: #ff8a3c;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #c7c7c7;
      margin-bottom: 22px;
    }
    .small {
      font-size: 12px;
      color: #8f8f8f;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Rust Server Solutions</span>
    </div>
    <h1><span>Rust</span> Server Solutions</h1>
    <p>High‑performance Rust servers configured and optimized for you. A dedicated setup and support service tailored for Rust communities and creators.</p>
    <p class="small">Full website and services launching soon.</p>
  </div>
</body>
</html>
